version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: climberoot
      MYSQL_DATABASE: climbing_db
    # 宿主机 3306/3307 已被占用，映射到 3308（容器内部仍是 3306）
    ports:
      - '3308:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-pclimberoot']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    ports:
      - '3000:3000'
    environment:
      # 项目没有提供数据库迁移文件，依赖 TypeORM synchronize 自动建表，
      # 而 synchronize 仅在 NODE_ENV !== 'production' 时开启，因此这里使用 development
      NODE_ENV: development
      # 统计按服务器本地时间切日，容器默认 UTC 会让东八区凌晨的记录落到前一天
      TZ: Asia/Shanghai
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: climberoot
      DB_DATABASE: climbing_db
      JWT_SECRET: your_jwt_secret_key_here_change_in_production
      CORS_ORIGIN: '*'
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

volumes:
  mysql_data:
  backend_uploads:
